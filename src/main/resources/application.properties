server.port=8080

# ---------- MySQL (change user/password for your machine) ----------
# createDatabaseIfNotExist=true -> the database is created automatically on first start
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:item_purchase_db}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}

# ---------- JPA / Hibernate ----------
# "update" creates the tables automatically
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# Reject 1.5 for an integer field instead of silently cutting it to 1
spring.jackson.deserialization.accept-float-as-int=false

# ---------- Spring Security / JWT ----------
# Secret must be at least 32 characters. Override with the JWT_SECRET environment variable in real use.
app.jwt.secret=${JWT_SECRET:change-this-secret-key-use-at-least-32-characters-long}
app.jwt.expiration-ms=86400000

# ---------- CORS (React dev server) ----------
app.cors.allowed-origins=http://localhost:5173,http://localhost:3000

# ---------- Demo data (admin/user accounts are always created if missing) ----------
app.seed-data=true
